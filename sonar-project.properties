# SonarQube / SonarCloud analysis (README "CI and the quality gate"). The CI workflow passes the
# token, the host and, for SonarCloud, the organization; nothing secret belongs in this file.
# Source: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
sonar.projectKey=maloferriol_miseflow
sonar.projectName=MiseFlow

sonar.sources=shared/src,server/src,web/src
sonar.exclusions=**/*.test.ts
sonar.tests=shared,server,web,e2e
sonar.test.inclusions=**/*.test.ts,shared/test/**,server/test/**,e2e/**
sonar.test.exclusions=**/node_modules/**

# One lcov file per workspace, from `npm run test:coverage`. Paths in them are repo-relative.
sonar.javascript.lcov.reportPaths=shared/coverage/lcov.info,server/coverage/lcov.info,web/coverage/lcov.info

# The scan waits for the quality gate and fails the CI check when the gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
