# Format check, lint, typecheck, build, tests with coverage, the Playwright e2e, then the SonarQube analysis
# and its quality gate (README "CI and the quality gate"). Any failing step fails the check, except the e2e:
# it reports its result but can't fail the job yet (CODING_STANDARDS "CI").
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Unset (no secret yet, or a pull request from a fork): the analysis step is skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The analysis needs the full history for new-code detection and blame.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # No dependency needs its install script: esbuild's binary comes from its platform package.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # The tests run against the local Supabase stack, as on a laptop: signing key, stack,
      # .env and test user, then the schema.
      - run: npm run setup:local
      - run: npm run db:migrate
      - run: npm run test:coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "*/coverage/lcov.info"
          if-no-files-found: warn

      # No cache: the browser and its system packages install fresh on each run. Like the e2e, it runs
      # when an earlier step failed.
      - name: Install Chromium for the e2e
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      # Non-blocking: a red e2e shows as an annotation and the job still passes.
      - name: e2e (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run e2e

      - name: Upload e2e reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: playwright-report/
          if-no-files-found: warn

      - name: SonarQube analysis and quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        # A third-party action, pinned to the commit behind its tag.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          # SonarCloud unless the repository variable names a SonarQube server.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >-
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
